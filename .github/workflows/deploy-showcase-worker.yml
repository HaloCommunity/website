name: Deploy showcase submission worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - workers/showcase-submission/**
      - .github/workflows/deploy-showcase-worker.yml
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      WORKER_GH_REPO_TOKEN: ${{ secrets.WORKER_GH_REPO_TOKEN || secrets.GH_REPO_TOKEN }}
      WORKER_TURNSTILE_SECRET: ${{ secrets.WORKER_TURNSTILE_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install configured package manager
        run: corepack install

      - name: Install worker dependencies
        run: corepack yarn install --immutable
        working-directory: workers/showcase-submission

      - name: Run worker tests
        run: corepack yarn test
        working-directory: workers/showcase-submission

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing Cloudflare API token. Set CLOUDFLARE_API_TOKEN or CF_API_TOKEN in repository secrets."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing Cloudflare account id. Set CLOUDFLARE_ACCOUNT_ID or CF_ACCOUNT_ID in repository secrets."
            exit 1
          fi

          if [ -z "$WORKER_GH_REPO_TOKEN" ]; then
            echo "Missing repository secret for GitHub repo token. Set WORKER_GH_REPO_TOKEN or GH_REPO_TOKEN."
            exit 1
          fi

      - name: Put GH repo token secret
        run: |
          printf '%s' "$WORKER_GH_REPO_TOKEN" | corepack yarn dlx wrangler secret put GH_REPO_TOKEN --config workers/showcase-submission/wrangler.toml

      - name: Put Turnstile secret (optional)
        shell: bash
        run: |
          if [ -n "$WORKER_TURNSTILE_SECRET" ]; then
            printf '%s' "$WORKER_TURNSTILE_SECRET" | corepack yarn dlx wrangler secret put TURNSTILE_SECRET --config workers/showcase-submission/wrangler.toml
          else
            echo "WORKER_TURNSTILE_SECRET is empty; skipping TURNSTILE_SECRET update."
          fi

      - name: Deploy worker
        run: corepack yarn dlx wrangler deploy --config workers/showcase-submission/wrangler.toml
