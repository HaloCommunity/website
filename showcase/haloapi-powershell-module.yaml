description: Official community PowerShell module for interacting with the Halo API.
details: |
  ## What it does
  HaloAPI provides PowerShell cmdlets to authenticate and work with Halo entities through the REST API.

  ## Install
  ```powershell
  Install-Module -Name HaloAPI -AllowPrerelease
  ```

